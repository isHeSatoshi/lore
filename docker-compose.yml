name: lore
services:
  hydradb-init:
    image: ghcr.io/hydra-db/hydradb:0.4.0
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /data/store /data/cache
        printf '%s\n' "$$HYDRA_TOKEN" > /data/auth-token
        chmod 600 /data/auth-token
        chown -R 10001:10001 /data
    environment:
      HYDRA_TOKEN: ${HYDRA_TOKEN:?set HYDRA_TOKEN in .env}
    volumes:
      - hydra_data:/data
  hydradb:
    image: ghcr.io/hydra-db/hydradb:0.4.0
    depends_on:
      hydradb-init:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      CLOUD_PROVIDER: local
      LOCAL_PATH: /data/store
      GRAPH_NAMESPACE: local
      GRAPH_ID: default
      GRAPH_CELL_ID: cell-0
      GRAPH_CELLS: cell-0
      GRAPH_DATA_PATH: data
      GRAPH_ALLOW_PLAINTEXT: "true"
      GRAPH_AUTH_TOKEN_FILE: /data/auth-token
      GRAPH_DATA_CACHE_BYTES: "268435456"
      GRAPH_DATA_CACHE_DIR: /data/cache
      GRAPH_NODE_ID: node-0
      GRAPH_BOLT_ADDR: 0.0.0.0:7687
      GRAPH_ADVERTISED_BOLT_ADDR: ${HYDRA_ADVERTISED:-127.0.0.1:17687}
      GRAPH_BOLT_NODE_ADDRESSES: node-0=${HYDRA_ADVERTISED:-127.0.0.1:17687}
      GRAPH_HTTP_ADDR: 0.0.0.0:8443
      GRAPH_ADMIN_ADDR: 0.0.0.0:9090
      RUST_MIN_STACK: "33554432"
      RUST_LOG: info
    ports:
      - "127.0.0.1:17687:7687"
      - "127.0.0.1:18443:8443"
      - "127.0.0.1:19091:9090"
    volumes:
      - hydra_data:/data
  app:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: deploy/Dockerfile.app
      args:
        LORE_LLM_TRANSPORT: ${LORE_LLM_TRANSPORT:-anthropic}
    depends_on:
      hydradb:
        condition: service_started
    restart: unless-stopped
    env_file: .env
    environment:
      LORE_ROOT: /app
      LORE_DATA_DIR: /app/data
      LORE_STATE_DIR: /app/state
      LORE_RESULTS_RUN: ${LORE_RESULTS_RUN:-r2}
      LORE_LLM_TRANSPORT: ${LORE_LLM_TRANSPORT:-anthropic}
      LORE_LLM_MODEL: ${LORE_LLM_MODEL:-MiniMax-M3.1-Flash}
      LORE_LLM_EFFORT: ${LORE_LLM_EFFORT:-medium}
      LORE_LLM_MAX_TOKENS: ${LORE_LLM_MAX_TOKENS:-8192}
      LORE_LLM_CONCURRENCY: "2"
      LORE_LLM_MIN_INTERVAL_S: "2"
      LORE_BEHIND_CLOUDFLARE: ${LORE_BEHIND_CLOUDFLARE:-0}
      HYDRA_BOLT_URI: bolt://hydradb:7687
      HYDRA_ADMIN_URL: http://hydradb:9090
      HYDRA_HTTP_URL: http://hydradb:8443
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data:ro
      - app_state:/app/state
    read_only: true
    tmpfs:
      - /tmp:size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
  caddy:
    profiles: ["prod"]
    image: caddy:2
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    environment:
      SITE_HOST: ${SITE_HOST:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  hydra_data:
  app_state:
  caddy_data:
  caddy_config:
